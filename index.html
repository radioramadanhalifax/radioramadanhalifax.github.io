<!DOCTYPE html>
<html>
<head>
  <title>Ramadan Radio Halifax</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #4b0082, #2e0854);
      color: #f5d547;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 60px;
      animation: fadeIn 1.5s ease-in;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(15px);}
      to {opacity: 1; transform: translateY(0);}
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
      text-shadow: 0 0 12px #f5d547;
    }

    p {
      font-size: 16px;
      margin-bottom: 20px;
    }

    .on-air {
      display: inline-block;
      font-weight: bold;
      color: #ff4c4c;
      font-size: 16px;
      margin-bottom: 15px;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%,50%,100% {opacity:1;}
      25%,75% {opacity:0;}
    }

    .player-container {
      display: inline-block;
      padding: 20px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      border-radius: 18px;
      box-shadow: 0 0 20px rgba(245,213,71,0.4);
      margin-bottom: 35px;
    }

    /* Animated gold divider */
    .gold-line {
      width: 75%;
      height: 3px;
      margin: 30px auto;
      border-radius: 3px;
      background: linear-gradient(90deg, transparent, #f5d547, transparent);
      background-size: 200% 100%;
      animation: shimmer 3s linear infinite;
    }

    @keyframes shimmer {
      from {background-position: -200% 0;}
      to {background-position: 200% 0;}
    }

    /* Sponsor glass panel */
    .sponsor-panel {
      width: 90%;
      max-width: 500px;
      margin: 0 auto 40px;
      padding: 25px 15px;
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(245,213,71,0.3);
    }

    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 35px;
      margin-bottom: 20px;
    }

    .logo-container img {
      height: 120px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 10px rgba(245,213,71,0.5));
      transition: transform 0.3s ease;
    }

    .logo-container img:hover {
      transform: scale(1.05);
    }

    .sponsored {
      font-size: 32px;
      text-shadow: 0 0 12px #f5d547;
      letter-spacing: 2px;
    }

    @media (max-width: 480px) {
      h1, .sponsored {
        font-size: 26px;
      }

      .logo-container img {
        height: 90px;
      }
    }

  </style>
</head>
<body>

<h1>Ramadan Radio Halifax</h1>
<div class="on-air">● ON AIR</div>
<p>Listen Live</p>

<div class="player-container">
  <script src="https://shoutstream.co.uk/player-min.js"></script>
  <script>
  radioFloPlayer.embed({
    'url': 'https://s2.free-shoutcast.com/stream/18066',
    'station-name': 'Radio Ramadan Halifax 88 FM',
    'autoplay': true,
    'skin': 'dark',
    'width': 280
  });
  </script>
</div>

<div class="gold-line"></div>

<div class="sponsor-panel">
  <div class="logo-container">
    <img src="SH.png" alt="S & H Architects Logo">
    <img src="eye.jpg" alt="The Eye Dr Logo">
  </div>
  <div class="sponsored">Sponsored By</div>
</div>

</body>
</html>
