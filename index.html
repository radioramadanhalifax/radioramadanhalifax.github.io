<!DOCTYPE html>
<html>
<head>
  <title>Ramadan Radio Halifax</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #4b0082;
      color: #f5d547;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 60px;
      margin: 0;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
      text-shadow: 0 0 10px #f5d547;
    }

    p {
      font-size: 16px;
      margin-bottom: 20px;
    }

    .on-air {
      display: inline-block;
      font-weight: bold;
      color: #ff4c4c;
      font-size: 16px;
      margin-bottom: 15px;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 50%, 100% { opacity: 1; }
      25%, 75% { opacity: 0; }
    }

    .player-container {
      display: inline-block;
      padding: 15px;
      background: #2e0854;
      border-radius: 15px;
      box-shadow: 0 0 15px #f5d547;
      margin-bottom: 30px;
    }

    .gold-line {
      width: 75%;
      height: 2px;
      background: #f5d547;
      margin: 30px auto;
      border-radius: 2px;
    }

    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
      padding: 10px 20px;
    }

    .logo-container img {
      height: 110px; /* Bigger + matched vertically */
      width: auto;
      object-fit: contain;
    }

    .sponsored {
      font-size: 32px; /* Same size as main heading */
      margin-top: 20px;
      text-shadow: 0 0 10px #f5d547;
      color: #f5d547;
    }

    @media (max-width: 480px) {
      .logo-container img {
        height: 85px;
      }

      h1, .sponsored {
        font-size: 26px;
      }
    }

  </style>
</head>
<body>

<h1>Ramadan Radio Halifax</h1>
<div class="on-air">● ON AIR</div>
<p>Listen Live</p>

<div class="player-container">
  <script src="https://shoutstream.co.uk/player-min.js"></script>
  <script id="radioFloPlayer">
  radioFloPlayer.embed({
    'url': 'https://s3.free-shoutcast.com/stream/18114',
    'station-name': 'Radio Ramadan Halifax 88 FM',
    'autoplay': true,
    'skin': 'dark',
    'width': 280
  });
  </script>
</div>

<div class="gold-line"></div>

<div class="logo-container">
  <img src="SH.png" alt="S & H Architects Logo">
  <img src="eye.jpg" alt="The Eye Dr Logo">
</div>

<div class="sponsored">
  Sponsored By
</div>

</body>
</html>
